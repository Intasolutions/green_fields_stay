services:
  - type: web
    name: green-fields-stay-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false          # You'll paste your Neon URL in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # You'll paste your Vercel URL after frontend is deployed
      - key: PYTHON_VERSION
        value: "3.11.0"
